<h1>{{ title }}</h1>

<p>Total Employees: {{ employeeCount }}</p>

<button (click)="increaseCount()">
  Add Employee
</button>

<hr>

<input
  type="text"
  [(ngModel)]="employeeName"
  placeholder="Enter employee name">

<p>Employee Name: {{ employeeName }}</p>

<button (click)="saveEmployee()">
  Save Employee
</button>
