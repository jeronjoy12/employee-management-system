<div class="dashboard">

  <h1>Employee Management System</h1>

  <div class="stats-container">

    <div class="stat-card">
      <h3>Total Employees</h3>
      <p>{{ employeeCount }}</p>
    </div>

    <div class="stat-card">
      <h3>Departments</h3>
      <p>5</p>
    </div>

    <div class="stat-card">
      <h3>Budget</h3>
      <p>₹25,00,000</p>
    </div>

  </div>

  <h2>Quick Information</h2>

  <div class="cards-container">

    <app-employee-card
      [employee]="employees[0]"
      (deleteEmployee)="handleDelete($event)">
    </app-employee-card>

    <app-department-card
      [department]="department"
      (selectDepartment)="handleDepartment($event)">
    </app-department-card>

  </div>

  <h2>Employees</h2>

  <ul>
    <li *ngFor="let employee of employees">
      {{ employee.name }}
    </li>
  </ul>



</div>
