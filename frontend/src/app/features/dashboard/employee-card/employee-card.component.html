<div class="card">

  <h3>Employee Information</h3>

  <div class="info-row">
    <span>Name:</span>
    <span>{{ employee.name }}</span>
  </div>

  <div class="info-row">
    <span>Department:</span>
    <span>{{ employee.department }}</span>
  </div>

  <div class="info-row">
    <span>Email:</span>
    <span>{{ employee.email }}</span>
  </div>

  <div class="info-row">
    <span>Salary:</span>
    <span>{{ employee.salary }}</span>
  </div>

  <button (click)="onDelete()">
    Delete Employee
  </button>

</div>
