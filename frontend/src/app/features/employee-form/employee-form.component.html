<button
  type="button"
  class="Table-btn"
  (click)="showTable()">
  Table
</button>
<form
  [formGroup]="employeeForm"
  (ngSubmit)="OnSubmit()">


  <div class="form-group">
    <label>Name</label>
    <input
      type="text"
      formControlName="name">
  </div>
  <div
    class="error"
      *ngIf=" employeeForm.get('name')?.invalid
          && employeeForm.get('name')?.touched">

name is required
  </div>

  <div class="form-group">
    <label>Department</label>
    <input
      type="text"
      formControlName="department">
  </div>

  <div class="form-group">
    <label>Email</label>
    <input
      type="email"
      formControlName="email">
  </div>
  <div
    class="error"
    *ngIf="
    employeeForm.get('email')?.errors?.['required'] &&
    employeeForm.get('email')?.touched
  ">
    Email is required
  </div>

  <div
    class="error"
    *ngIf="
    employeeForm.get('email')?.errors?.['email'] &&
    employeeForm.get('email')?.touched
  ">
    Invalid email format
  </div>

  <div class="form-group">
    <label>Salary</label>
    <input
      type="number"
      formControlName="salary">
  </div>
  <div
    class="error"
    *ngIf="
    employeeForm.get('salary')?.errors?.['min'] &&
    employeeForm.get('salary')?.touched
  ">
    Salary must be greater than 0
  </div>

  <button
    type="submit"
    class="submit-btn"
    [disabled]="employeeForm.invalid">
    Save Employee
  </button>


</form>
