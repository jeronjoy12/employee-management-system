<div class="form-container">

  <div class="header">
    <h2>Employee Form</h2>

    <button class="secondary-btn" (click)="showTable()">
      View Employees
    </button>
  </div>

  <div class="form-group">
    <label>Name</label>
    <input
      type="text"
      [(ngModel)]="employee.name">
  </div>

  <div class="form-group">
    <label>Department</label>
    <input
      type="text"
      [(ngModel)]="employee.department">
  </div>

  <div class="form-group">
    <label>Email</label>
    <input
      type="email"
      [(ngModel)]="employee.email">
  </div>

  <div class="form-group">
    <label>Salary</label>
    <input
      type="number"
      [(ngModel)]="employee.salary">
  </div>

  <button class="submit-btn" (click)="OnSubmit()">
    Save Employee
  </button>

</div>
