<button
  type="button"
  class="Table-btn"
  (click)="showTable()">
  Table
</button>
<form
  [formGroup]="employeeForm"
  (ngSubmit)="OnSubmit()">


  <div class="form-group">
    <label>Name</label>
    <input
      type="text"
      formControlName="name">
  </div>
  <div
    class="error"
      *ngIf=" employeeForm.get('name')?.invalid
          && employeeForm.get('name')?.touched &&
          employeeForm.get('name')?.errors?.['invalidName']"
  >

name is required in letters
  </div>


  <div class="form-group">
    <label>Department</label>
    <input
      type="text"
      formControlName="department">
  </div>

  <div class="form-group">
    <label>Email</label>
    <input
      type="email"
      formControlName="email">

      <label>Confirm Email</label>

      <input
        type="email"
        formControlName="confirmEmail">

  </div>
  <div
    class="error"
    *ngIf="
    employeeForm.get('email')?.errors?.['required'] &&
    employeeForm.get('email')?.touched
  ">
    Email is required
  </div>

  <div
    class="error"
    *ngIf="
    employeeForm.get('email')?.errors?.['email'] &&
    employeeForm.get('email')?.touched
  ">
    Invalid email format
  </div>

  <div
    *ngIf="
    employeeForm.errors?.['emailMismatch']
    &&
    employeeForm.get('confirmEmail')?.touched
  ">
    Emails do not match
  </div>

  <div class="form-group">
    <label>Salary</label>
    <input
      type="number"
      formControlName="salary">
  </div>

  <div
    *ngIf="
    employeeForm.get('salary')?.touched &&
    employeeForm.get('salary')?.errors?.['invalidSalary']
  ">
    Salary must be at least 10000
  </div>

  <button
    type="submit"
    class="submit-btn"
    [disabled]="employeeForm.invalid">
    Save Employee
  </button>


</form>
